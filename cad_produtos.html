<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-info">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">LOJA NIPEN</a>
        <button class="navbar-toggler" type="button">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Principal</a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="cad_usuario.html"
                >Cadastro de Usuário</a
              >
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="list_usuario.html"
                >Lista de Usuários</a
              >
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="cad_produtos.html"
                >Cadastro de Produtos</a
              >
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="list_produtos.html"
                >Lista de Produtos</a
              >
            </li>
          </ul>

          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Pesquisar"
            />
          </form>
          <a href="login.html" class="btn btn-danger">Sair</a>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <div class="container my-5">
        <div class="card shadow-sm">
          <div class="card-body p-4 p-md-5">
            <h2 class="mb-4">Cadastro de Produtos</h2>
            <form action="list_produtos.html" method="POST">
              <div class="mb-3">
                <label for="nome" class="form-label">Nome do Produto:</label>
                <input
                  type="text"
                  class="form-control"
                  id="nome"
                  placeholder="Digite o Nome do Produto"
                  name="nome"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="descricao" class="form-label"
                  >Descrição do Produto:</label
                >
                <input
                  type="type"
                  class="form-control"
                  id="descricao"
                  name="descricao"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="qtd" class="form-label">Quantidade:</label>
                <input
                  type="number"
                  class="form-control"
                  id="qtd"
                  name="qtd"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="preco-un" class="form-label">Valor Unitário:</label>
                <input
                  type="number"
                  class="form-control"
                  id="preco-un"
                  name="preco-un"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="categoria" class="form-label">Categoria:</label>
                <input
                  type="text"
                  class="form-control"
                  id="categoria"
                  name="categoria"
                  required
                />
              </div>

              <button type="submit" class="btn btn-success">Cadastrar</button>
              <button type="button" class="btn btn-warning">Voltar</button>
              <button type="reset" class="btn btn-danger">Limpar</button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <footer class="footer-site">
      Projeto desenvolvido por: Caio Vinicius Alves e Victor Hugo P. Silva
    </footer>
  </body>
</html>
