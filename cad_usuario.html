<!doctype html>
<html lang="pt-BR">
  
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tela de Cadastro de Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  
  <body>
    
<form>
  <!-- Nome -->
  <div class="mb-3">
    <label for="nome" class="form-label">Nome Completo:</label>
    <input type="text" class="form-control" id="nome" placeholder="Digite seu nome completo" required>
  </div>

  <!-- E-mail -->
  <div class="mb-3">
    <label for="email" class="form-label">E-mail:</label>
    <input type="email" class="form-control" id="email" aria-describedby="emailHelp" placeholder="exemplo@dominio.com" required>
    <div id="emailHelp" class="form-text">Seu e-mail não será compartilhado.</div>
  </div>

  <!-- CPF -->
  <div class="mb-3">
    <label for="cpf" class="form-label">CPF:</label>
    <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" required>
  </div>

  <!-- Celular -->
  <div class="mb-3">
    <label for="celular" class="form-label">Celular (Com DDD):</label>
    <input type="tel" class="form-control" id="celular" placeholder="(00) 00000-0000" required>
  </div>

  <!-- Data de Nascimento -->
  <div class="mb-3">
    <label for="nascimento" class="form-label">Data de Nascimento:</label>
    <input type="date" class="form-control" id="nascimento" required>
  </div>

  <!-- Gênero -->
  <div class="mb-3">
    <label for="genero" class="form-label">Gênero:</label>
    <select class="form-select" id="genero" required>
      <option value="">Selecione</option>
      <option value="masculino">Masculino</option>
      <option value="feminino">Feminino</option>
      <option value="outro">Outro</option>
      <option value="nao-informar">Prefiro não informar</option>
    </select>
  </div>

  <!-- Endereço completo -->
  <div class="mb-3">
    <label for="endereco" class="form-label">Endereço:</label>
    <input type="text" class="form-control" id="endereco" placeholder="Rua, número, complemento" required>
  </div>

  <div class="mb-3">
    <label for="cidade" class="form-label">Cidade:</label>
    <input type="text" class="form-control" id="cidade" placeholder="Digite sua cidade" required>
  </div>

  <div class="mb-3">
    <label for="estado" class="form-label">Estado:</label>
    <select class="form-select" id="estado" required>
      <option value="">Selecione seu estado</option>
      <option value="AC">Acre (AC)</option>
      <option value="AL">Alagoas (AL)</option>
      <option value="AP">Amapá (AP)</option>
      <option value="AM">Amazonas (AM)</option>
      <option value="BA">Bahia (BA)</option>
      <option value="CE">Ceará (CE)</option>
      <option value="DF">Distrito Federal (DF)</option>
      <option value="ES">Espírito Santo (ES)</option>
      <option value="GO">Goiás (GO)</option>
      <option value="MA">Maranhão (MA)</option>
      <option value="MT">Mato Grosso (MT)</option>
      <option value="MS">Mato Grosso do Sul (MS)</option>
      <option value="MG">Minas Gerais (MG)</option>
      <option value="PA">Pará (PA)</option>
      <option value="PB">Paraíba (PB)</option>
      <option value="PR">Paraná (PR)</option>
      <option value="PE">Pernambuco (PE)</option>
      <option value="PI">Piauí (PI)</option>
      <option value="RJ">Rio de Janeiro (RJ)</option>
      <option value="RN">Rio Grande do Norte (RN)</option>
      <option value="RS">Rio Grande do Sul (RS)</option>
      <option value="RO">Rondônia (RO)</option>
      <option value="RR">Roraima (RR)</option>
      <option value="SC">Santa Catarina (SC)</option>
      <option value="SP">São Paulo (SP)</option>
      <option value="SE">Sergipe (SE)</option>
      <option value="TO">Tocantins (TO)</option>
    </select>
  </div>

  <!-- Senha -->
  <div class="mb-3">
    <label for="senha" class="form-label">Senha:</label>
    <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" required>
  </div>

  <!-- Confirmar Senha -->
  <div class="mb-3">
    <label for="confirmarSenha" class="form-label">Confirmar Senha:</label>
    <input type="password" class="form-control" id="confirmarSenha" placeholder="Confirme sua senha" required>
  </div>

  <!-- Tipo de Usuário -->
  <div class="mb-3">
    <label for="tipoUsuario" class="form-label">Tipo de Usuário:</label>
    <select class="form-select" id="tipoUsuario" required>
      <option value="">Selecione</option>
      <option value="admin">Administrador</option>
      <option value="funcionario">Funcionário</option>
      <option value="cliente">Cliente</option>
    </select>
  </div>

  <!-- Botão -->
  <button type="submit" class="btn btn-success">Cadastrar</button>
  <button type="button" class="btn btn-warning" onclick="window.history.back()">Voltar</button>
  <button type="reset" class="btn btn-danger">Limpar</button>
</form>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
  
</html>
